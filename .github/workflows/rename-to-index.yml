name: Rename portfolio to index

on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename personal-portfolio.html to index.html
        run: |
          if [ -f personal-portfolio.html ] && [ ! -f index.html ]; then
            git config user.name "richardmoriss"
            git config user.email "richardmoriss@users.noreply.github.com"
            git mv personal-portfolio.html index.html
            git commit -m "Rename personal-portfolio.html to index.html"
            git push
          else
            echo "Nothing to rename"
          fi
