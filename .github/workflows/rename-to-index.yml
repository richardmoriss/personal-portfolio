name: Rename personal-portfolio.html to index.html
on:
  push:
    branches: [main]
    paths:
      - personal-portfolio.html
      - .github/workflows/rename-to-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename personal-portfolio.html to index.html
        run: |
          if [ -f personal-portfolio.html ] && [ ! -f index.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mv personal-portfolio.html index.html
            git add -A
            git commit -m "Rename personal-portfolio.html to index.html"
            git push
          fi
